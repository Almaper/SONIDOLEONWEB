# Panel de administración de sonidoleon.com (Pages CMS · https://app.pagescms.org)
# Cada vez que se guarda algo, GitHub vuelve a publicar la web sola en 2-3 minutos.
# Textos cortos: como mucho dos líneas. La web enseña, no vende.

media:
  input: public/images
  output: /images

content:
  # ───────────────────────── CONCEPTOS ─────────────────────────
  - name: proyectos
    label: Conceptos
    type: file
    path: content/proyectos.json
    fields:
      - name: title
        label: Título de la sección
        type: string
      - name: subtitle
        label: Subtítulo de la sección (una línea)
        type: string
      - name: items
        label: Conceptos
        description: Arrastra para cambiar el orden. Para quitar uno sin borrarlo, desmarca «Publicado».
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{h1}"
        fields:
          - name: published
            label: Publicado
            type: boolean
          - name: h1
            label: Título
            type: string
            required: true
          - name: category
            label: Etiqueta
            description: "Normalmente «Concepto». Si un día se realiza, puedes poner «Proyecto»."
            type: string
          - name: image
            label: Imagen principal (horizontal)
            type: image
            options:
              path: public/images/conceptos
              extensions: [jpg, jpeg, png, webp]
          - name: imageNote
            label: Nota bajo la imagen (opcional)
            description: "Ej.: «Imagen 3D provisional» o «Imagen de referencia (Unsplash)». Déjala vacía con imágenes propias."
            type: string
          - name: description
            label: Texto (una o dos líneas por casilla)
            type: text
            list: true
          - name: characteristics
            label: Elementos (opcional)
            type: object
            fields:
              - name: title
                label: Título
                type: string
              - name: items
                label: Elementos (pocas palabras cada uno)
                type: string
                list: true
          - name: gallery
            label: Más imágenes (opcional)
            type: image
            options:
              path: public/images/conceptos
              extensions: [jpg, jpeg, png, webp]
              multiple:
                max: 12
          - name: slug
            label: Dirección de la página (opcional)
            description: "Lo que va detrás de sonidoleon.com/conceptos/. Si lo dejas vacío se crea solo a partir del título."
            type: string
            pattern:
              regex: "^[a-z0-9-]*$"
              message: Solo minúsculas, números y guiones, sin tildes ni espacios.
          - name: seoTitle
            label: Título para Google (opcional)
            type: string
          - name: metaDescription
            label: Descripción para Google (opcional)
            type: text
          - name: workDone
            type: object
            hidden: true
            fields:
              - name: title
                type: string
              - name: items
                type: string
                list: true
          - name: impact
            type: object
            hidden: true
            fields:
              - name: title
                type: string
              - name: text
                type: text
          - name: cta
            type: text
            hidden: true

  # ───────────────────────── PORTADA ─────────────────────────
  - name: portada
    label: Portada, enfoque y qué hacemos
    type: file
    path: content/portada.json
    fields:
      - name: maintenanceMode
        label: Web en mantenimiento
        description: "Si lo marcas, la portada muestra solo la pantalla de mantenimiento. Para ver la web completa mientras tanto: sonidoleon.com/?previa"
        type: boolean
      - name: maintenance
        label: Pantalla de mantenimiento
        type: object
        fields:
          - name: title
            label: Título
            type: string
          - name: text
            label: Texto
            type: text
          - name: since
            label: En renovación desde
            description: Fecha que se muestra en la pantalla. Cámbiala cuando vuelvas a activar el mantenimiento.
            type: date
      - name: hero
        label: Cabecera
        type: object
        fields:
          - name: badge
            label: Etiqueta superior
            type: string
          - name: subtitle
            label: Frase principal
            type: string
          - name: image
            label: Imagen de fondo
            type: image
            options:
              path: public/images/web
          - name: title
            type: string
            hidden: true
          - name: highlight
            type: string
            hidden: true
      - name: about
        label: Enfoque
        type: object
        fields:
          - name: title
            label: Etiqueta
            type: string
          - name: paragraphs
            label: Frases (la primera sale grande)
            type: text
            list: true
      - name: services
        label: Qué hacemos
        type: object
        fields:
          - name: title
            label: Título
            type: string
          - name: subtitle
            label: Subtítulo (opcional)
            type: string
          - name: items
            label: Líneas de trabajo
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Nombre
                type: string
              - name: description
                label: Descripción (una línea)
                type: string
              - name: icon
                label: Icono
                type: select
                options:
                  values:
                    - name: monitor
                      label: Proyección / videomapping
                    - name: box
                      label: Espacio / inmersivo
                    - name: hand
                      label: Interactivo
                    - name: lightbulb
                      label: Iluminación
                    - name: volume
                      label: Sonido
              - name: id
                type: string
                hidden: true

  # ───────────────────────── CONTACTO ─────────────────────────
  - name: contacto
    label: Contacto
    type: file
    path: content/contacto.json
    fields:
      - name: title
        label: Título
        type: string
      - name: subtitle
        label: Subtítulo (opcional)
        type: string
      - name: info
        label: Datos de contacto
        type: object
        fields:
          - name: phone
            label: Teléfono
            type: string
          - name: email
            label: Email
            type: string
          - name: address
            label: Dirección
            type: string
      - name: social
        label: Redes sociales
        description: Deja «#» en las que no uséis.
        type: object
        fields:
          - name: instagram
            label: Instagram
            type: string
          - name: youtube
            label: YouTube
            type: string
          - name: facebook
            label: Facebook
            type: string
      - name: footer
        label: Pie de página
        type: object
        fields:
          - name: copyright
            label: Texto de copyright
            type: string
